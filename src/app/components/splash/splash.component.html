<!-- Main Background Placeholder (Dark) -->
<div class="absolute inset-x-0 top-0 bottom-[20%] bg-cover bg-top z-0" [style.background-image]="'url(splash.webp)'"></div>

<!-- Gradient to blend -->
<div class="absolute inset-x-0 bottom-[15%] h-[25%] bg-gradient-to-t from-[#090b14] to-transparent z-0"></div>
<div class="absolute inset-x-0 bottom-0 h-[15%] bg-[#090b14] z-0"></div>

<!-- Setting Button -->
<div class="absolute top-4 right-4 z-50">
  <button (click)="goToSettings()" class="p-3 bg-black/50 backdrop-blur rounded-full hover:bg-black/70 active:scale-95 transition-all shadow-xl ring-2 ring-white/20 flex items-center justify-center">
    <mat-icon class="text-white">settings</mat-icon>
  </button>
</div>

<!-- Speaker Button -->
<div class="absolute top-4 left-4 z-50">
  <button 
    (click)="toggleBgmMute()"
    class="relative group w-12 h-12 flex items-center justify-center rounded-full 
           bg-slate-800 border-2 border-slate-600 shadow-[0_4px_0_0_rgba(15,23,42,1)] 
           active:shadow-none active:translate-y-1 transition-all duration-75"
    [class.bg-red-900]="isBgmMuted()"
    [class.border-red-700]="isBgmMuted()"
  >
    <div class="absolute inset-0 rounded-full opacity-0 group-hover:opacity-20 bg-white transition-opacity"></div>

    @if( !isBgmMuted() ) {
    <ng-container>
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
      </svg>
    </ng-container>
    } @else {
    <ng-container>
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" stroke="red" />
      </svg>
    </ng-container>
    }
  </button>
</div>

<div class="flex flex-col justify-end items-center pb-8 px-4 relative z-10 w-full h-full">
  <!-- Interactive Enemy Buttons Using Image Cuts -->
  <div class="w-full max-w-[500px] flex flex-col items-center">
    <div class="flex justify-center w-full gap-2 md:gap-4 mb-4">
      @for (enemy of enemies; track enemy.id) {
          <button (click)="startBattle(enemy)" 
                  class="enemy-btn group w-20 h-20 rounded-full bg-center bg-cover bg-no-repeat hover:scale-110 active:scale-95 transition-all relative overflow-hidden ring-2 ring-transparent shadow-lg"
                  [ngClass]="getHoverRing(enemy.id)"
                  [style.background-image]="'url(' + enemy.id + '.webp)'">
            <div class="absolute inset-0 bg-black/30 group-hover:bg-transparent transition-colors"></div>
          </button>
      }
    </div>
    
    <p class="text-white/90 font-bold tracking-widest text-xs sm:text-sm md:text-base uppercase text-center drop-shadow-[0_2px_4px_rgba(0,0,0,1)]">
      Select your enemy <br/> to start the battle!
    </p>
  </div>
</div>
