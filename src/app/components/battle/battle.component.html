<div class="flex flex-col h-full bg-slate-900 overflow-y-auto overflow-x-hidden relative selection:bg-transparent">
  <!-- Top Half: Battle Arena -->
  <div class="flex-1 min-h-[250px] relative border-b-4 border-slate-950 shadow-inner overflow-hidden transition-colors duration-500" [ngClass]="enemy()?.themeClass || 'bg-slate-800'">
    
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 24px 24px;"></div>

    <!-- Exit -->
    <div (click)="exit()" class="absolute top-6 left-6  bg-black/50 px-5 py-2 rounded-full backdrop-blur-md z-30 ring-1 ring-white/10 shadow-2xl flex items-center space-x-2">
      <div class="text-lg font-bold text-slate-100">X</div>
    </div>

    <!-- Timer -->
    <div class="absolute top-6 left-1/2 -translate-x-1/2 bg-black/50 px-5 py-2 rounded-full backdrop-blur-md z-30 ring-1 ring-white/10 shadow-2xl flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></span>
      <span class="text-xl font-mono font-bold text-white tracking-widest">{{ formattedTime() }}</span>
    </div>
    
    <div class="absolute top-6 right-6 bg-black/50 px-4 py-2 rounded-full backdrop-blur-md z-30 ring-1 ring-white/10 shadow-xl">
      <span class="text-sm font-bold text-slate-200 tracking-wider">{{ game.currentQuestionIndex() + 1 }}<span class="text-slate-500 mx-1">/</span>{{ game.questions().length }}</span>
    </div>

    <!-- Arena Floor -->
    <!--<div class="absolute bottom-0 left-0 w-full h-[40%] bg-gradient-to-t from-black/60 to-transparent rounded-t-[100%] scale-150 transform origin-bottom z-10"></div>-->

    <!-- Characters -->
    <div class="w-full h-full flex justify-center">

      <div class="relative w-full flex bg-slate-950 overflow-hidden border-b-4 border-slate-800">

        <div class="flex-1 flex items-center justify-center relative overflow-hidden">
          <!--<img (click)="triggerCorrectAnim()"
            [src]="'capybara.webp'" 
            alt="Capybara Hero" 
            class="h-full max-w-none origin-center -translate-x-[150px] transition-all"
            [class.animate-result-win]="isHit()"
            [class.animate-result-lose]="isHeroHit()"
          />-->
          <app-battle-video #heroBattleVideoComponent [hero]="true" [enemy]="false" [battleVideo]="heroBattleVideo"></app-battle-video>
        </div>

        <div class="1w-16 h-full flex items-center justify-center relative shrink-0 z-10">
          <div class="absolute inset-y-0 w-1.5 bg-white shadow-[0_0_20px_5px_rgba(255,255,255,0.9)]"></div>
        </div>

        <div class="flex-1 flex items-center justify-center relative overflow-hidden">
          <!--<img (click)="triggerIncorrectAnim()"
            [src]="enemy()?.id +'.webp'" 
            alt="Enemy" 
            class="h-full max-w-none origin-center translate-x-[100px] transition-all"
            [class.animate-result-win]="isHeroHit()"
            [class.animate-result-lose]="isHit()"
          />-->
          <app-battle-video #enemyBattleVideoComponent [hero]="false" [enemy]="true" [battleVideo]="enemyBattleVideo()"></app-battle-video>
        </div>

        <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/60 pointer-events-none"></div>
      </div>
    </div>

    <!-- Question Bubble -->
    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 z-20 w-[90%] transition-all duration-300 transform" 
          [class.opacity-0]="isHit() || isHeroHit()" [class.scale-90]="isHit() || isHeroHit()" 
          [class.opacity-100]="!isHit() && !isHeroHit()" [class.scale-100]="!isHit() && !isHeroHit()">
      @if (currentQ()) {
          <div class="bg-white/95 backdrop-blur-sm text-slate-900 rounded-[32px] px-6 shadow-2xl relative border-b-[6px] border-slate-300 flex justify-center items-center">
            <div class="text-[2.75rem] text-center font-black font-mono tracking-tighter">{{ currentQ()!.num1 }} <span class="text-rose-500 mx-1">{{ currentQ()!.operator }}</span> {{ currentQ()!.num2 }} = <span class="text-emerald-500">?</span></div>
            <!-- triangle pointer -->
            <!--<div class="absolute -top-3 right-1/4 w-8 h-8 bg-white rotate-45 transform origin-top-left -z-10 border-b-2 border-r-2 border-slate-300"></div>-->
          </div>
      }
    </div>
      
  </div>

  <!-- Bottom Half: Keypad -->
  <div class="h-[55%] min-h-[380px] shrink-0 bg-slate-950 flex flex-col p-5 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-40 relative">
    <!-- Input Display -->
    <div class="mb-5 bg-slate-900 rounded-3xl h-20 flex items-center justify-end px-6 shadow-inner ring-1 ring-white/10 border-b-4 border-slate-800 transition-colors"
        [class.bg-emerald-950]="isHit()" [class.ring-emerald-500]="isHit()"
        [class.bg-rose-950]="isHeroHit()" [class.ring-rose-500]="isHeroHit()">
        <span class="text-5xl font-mono font-bold tracking-widest"
              [class.text-emerald-400]="!isHeroHit()" [class.text-amber-500]="isHeroHit()">
          {{ input() || '_' }}
        </span>
    </div>

    <!-- Pad Grid -->
    <div class="flex-1 grid grid-cols-3 gap-3">
      @for (n of [1, 2, 3, 4, 5, 6, 7, 8, 9]; track n) {
          <button (click)="appendNum(n)" 
                  class="bg-slate-800 rounded-2xl flex items-center justify-center text-4xl font-bold font-mono text-white/90 active:scale-95 active:bg-slate-700 transition-all border-b-[6px] border-slate-900 shadow-md">
            {{ n }}
          </button>
      }
      <button (click)="clear()" 
              class="bg-rose-950/30 rounded-2xl flex items-center justify-center text-xl font-bold text-rose-400 active:scale-95 active:bg-rose-900/50 transition-all border-b-[6px] border-slate-900 shadow-md uppercase tracking-wider">
        Clear
      </button>
      <button (click)="appendNum(0)" 
              class="bg-slate-800 rounded-2xl flex items-center justify-center text-4xl font-bold font-mono text-white/90 active:scale-95 active:bg-slate-700 transition-all border-b-[6px] border-slate-900 shadow-md">
        0
      </button>
      <button (click)="submit()" 
              class="bg-emerald-700/80 rounded-2xl flex items-center justify-center text-3xl font-bold text-white active:scale-95 active:bg-emerald-600 transition-all border-b-[6px] border-slate-900 shadow-md">
        <mat-icon class="scale-150">bolt</mat-icon>
      </button>
    </div>
  </div>
</div>
